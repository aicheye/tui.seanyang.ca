[package]
name = "tui-seanyang-me"
version = "3.1.0"
edition = "2024"
authors = ["Sean Yang <sean@seanyang.me>"]
description = "SSH server for seanyang.me"
license = "MIT"
repository = "https://github.com/aicheye/tui.seanyang.me"

[[bin]]
name = "tui-seanyang-me"
path = "src/main.rs"

[dependencies]
# SSH TUI framework
chai-framework = "2.1"

# TUI (must match chai-framework's ratatui version)
ratatui = "0.30"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for pulling site data. rustls (default crypto provider is
# aws-lc-rs, already in the tree via russh) avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization of the JSON site data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
unicode-width = "0.2"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
