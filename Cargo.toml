[package]
name = "tui-seanyang-me"
version = "1.0.1"
edition = "2024"
authors = ["Sean Yang <sean@seanyang.me>"]
description = "SSH server for seanyang.me"
license = "MIT"
repository = "https://github.com/aicheye/tui.seanyang.me"

[[bin]]
name = "tui-seanyang-me"
path = "src/main.rs"

[dependencies]
# SSH TUI framework
chai-framework = "2.0"

# TUI (must match chai-framework's ratatui version)
ratatui = "0.30"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
