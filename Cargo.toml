[package]
name = "tui-seanyang-me"
version = "0.2.1"
edition = "2024"
authors = ["Sean Yang <sean@seanyang.me>"]
description = "SSH server for seanyang.me"
license = "MIT"
repository = "https://github.com/aicheye/tui.seanyang.me"

[[bin]]
name = "tui-seanyang-me"
path = "src/main.rs"

[dependencies]
# SSH server
russh = "0.44"
russh-keys = "0.44"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
anyhow = "1"
rand = "0.8"
async-trait = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
