name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  build:
    needs: pre-commit
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: tui-seanyang-me-linux-x64
          - os: ubuntu-22.04-arm
            asset_name: tui-seanyang-me-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --verbose
    - name: Archive binary (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: bash
      run: |
        cd target/release
        7z a ${{ matrix.asset_name }}.zip tui-seanyang-me
    - name: Archive binary (Unix)
      if: contains(matrix.os, 'windows') == false
      shell: bash
      run: |
        cd target/release
        zip ${{ matrix.asset_name }}.zip tui-seanyang-me
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/release/${{ matrix.asset_name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: tui-seanyang-me-*
        path: artifacts
        merge-multiple: true

    - name: Generate checksums
      run: |
        cd artifacts
        sha256sum *.zip > sha256sums.txt

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
